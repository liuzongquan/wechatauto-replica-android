[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechatauto-replica-android"
version = "0.1.0"
description = "Safety-bound Android WeChat UI controller and explicit user-export tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "wechatauto-replica-android contributors"}]
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
android = ["uiautomator2==3.7.1"]
root = ["sqlcipher3-binary==0.5.4"]
keycapture = ["frida==16.7.19"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "build>=1.2,<2", "ruff>=0.8,<1"]

[project.scripts]
wechatauto-android = "wechatauto_android.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechatauto_android = ["py.typed", "profiles/*.json", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
